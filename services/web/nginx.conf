# nginx serving the VMIS PWA. SPA routes fall back to index.html; API paths are
# proxied to the FastAPI backend so the browser talks to one origin (no CORS)
# and the same deployment works on-prem. The service worker (sw.js) and the
# manifest must never be cached so updates roll out on reload.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not cache the service worker or the app shell entrypoint.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # API + auth + sync are proxied to the backend container.
    location ~ ^/(auth|visitors|visits|activities|sync|management|health) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the SPA: fall back to index.html for client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
